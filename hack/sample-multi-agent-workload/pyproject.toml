[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-sample-workload"
version = "0.1.0"
description = "Local synthetic retail workload for FinOps experiments."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10,<4",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlglot>=26,<30",
    "uvicorn>=0.30,<1",
    "azure-identity>=1.24,<2",
    "azure-monitor-opentelemetry-exporter>=1.0.0b32,<2",
    "openai>=2,<3",
    "opentelemetry-sdk>=1.30,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
sample-workload = "sample_workload.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
