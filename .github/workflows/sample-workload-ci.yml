name: Sample workload CI

on:
  push:
    branches:
      - dev
    paths:
      - hack/sample-multi-agent-workload/**
      - .github/workflows/sample-workload-ci.yml
      - .github/workflows/sample-workload-cd.yml
      - hack/sandbox.config.json
  pull_request:
    branches:
      - dev
    paths:
      - hack/sample-multi-agent-workload/**
      - .github/workflows/sample-workload-ci.yml
      - .github/workflows/sample-workload-cd.yml
      - hack/sandbox.config.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-sample:
    name: Local sample acceptance
    if: github.repository == 'bobjac/finops-toolkit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hack/sample-multi-agent-workload
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install sample dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'

      - name: Check formatting, lint, and types
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy src tests

      - name: Run functional and SQL-safety tests
        run: python -m pytest -q

      - name: Test fail-closed deployment eligibility
        run: node --test tests/deployment.test.mjs

      - name: Test and lint the sample deployment lifecycle
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.7 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $result = Invoke-Pester ./tests/SampleDeployment.Tests.ps1 -PassThru -Output Detailed
          if ($result.FailedCount -or $result.Result -ne 'Passed') { throw 'Sample preflight tests failed.' }
          $issues = @(Invoke-ScriptAnalyzer -Path ./eng -Recurse -Severity Warning,Error)
          if ($issues.Count) { $issues | Format-Table -AutoSize; throw 'Sample lifecycle lint failed.' }

      - name: Validate sample infrastructure
        run: |
          az bicep build --file infra/main.bicep --stdout > "$RUNNER_TEMP/sample-template.json"
          python3 - "$RUNNER_TEMP/sample-template.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as source:
              template = json.load(source)
          roles = next(resource for resource in template["resources"] if resource["name"] == "roleAssignments")
          assignments = roles["properties"]["template"]["resources"]
          runtime = [role for role in assignments if role["properties"]["principalId"] == "[parameters('runtimePrincipalId')]"]
          assert len(runtime) == 4
          for role in runtime:
              assert "runtimeIdentityResourceId" in role["name"]
              assert "runtimePrincipalId" not in role["name"] and "reference(" not in role["name"]
          identity_id = roles["properties"]["parameters"]["runtimeIdentityResourceId"]["value"]
          assert "resourceId(" in identity_id and "reference(" not in identity_id
          for scope in ("appInsights", "openAi"):
              assert any(f"'{scope}'" in dependency for dependency in roles["dependsOn"])
          PY

      - name: Build and start the explicit offline container
        run: |
          set -euo pipefail
          docker build -t sample-workload:ci .
          docker run --rm -e IDENTITY_ENDPOINT=http://127.0.0.1:9 \
            -e IDENTITY_HEADER=synthetic-header sample-workload:ci \
            python -c 'from azure.identity.aio import ManagedIdentityCredential; ManagedIdentityCredential(client_id="00000000-0000-0000-0000-000000000001")'
          if docker run --rm sample-workload:ci; then
            echo 'A missing model mode must fail startup.' >&2
            exit 1
          fi
          docker run -d --name sample-ci -p 127.0.0.1:8080:8080 \
            -e SAMPLE_MODEL_MODE=deterministic sample-workload:ci
          trap 'docker rm -f sample-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ready; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/ready
          curl --fail --silent http://127.0.0.1:8080/api/questions \
            -H 'Content-Type: application/json' \
            -d '{"question":"Which products are below their reorder point?","sessionId":"ci","experimentId":"ci"}' \
            | python -c 'import json,sys; r=json.load(sys.stdin); assert r["answerStatus"]=="answered"; assert r["data"]["rows"]==[["P-1002","Lantern",3,5],["P-1004","Jacket",2,5]]'

      - name: Run offline golden evaluation
        run: |
          python -m sample_workload initialize --database data/retail.db --seed 42
          python -m sample_workload evaluate --database data/retail.db \
            --model-mode deterministic --questions tests/evaluation/questions.json \
            --output evidence/evaluation.json

      - name: Retain evaluation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: offline-sample-evaluation
          path: hack/sample-multi-agent-workload/evidence/evaluation.json
          if-no-files-found: warn
          retention-days: 7
