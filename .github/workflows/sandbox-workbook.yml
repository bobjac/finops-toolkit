name: Sandbox workbook

on:
  push:
    branches: [dev]
    paths:
      - src/workbooks/optimization/AiAgentTokenomicsLivePrices/**
      - src/scripts/*DesignTimeOptimizerWorkbook.ps1
      - src/powershell/Tests/Unit/DesignTimeOptimizerWorkbook.Tests.ps1
      - hack/sample-multi-agent-workload/eng/Sample-Common.ps1
      - hack/sample-multi-agent-workload/eng/check-deployment.mjs
      - .github/workflows/sandbox-workbook.yml
  pull_request:
    branches: [dev]
    paths:
      - src/workbooks/optimization/AiAgentTokenomicsLivePrices/**
      - src/scripts/*DesignTimeOptimizerWorkbook.ps1
      - src/powershell/Tests/Unit/DesignTimeOptimizerWorkbook.Tests.ps1
      - hack/sample-multi-agent-workload/eng/Sample-Common.ps1
      - hack/sample-multi-agent-workload/eng/check-deployment.mjs
      - .github/workflows/sandbox-workbook.yml
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the workbook or validate its existing deployment and queries
        type: choice
        options: [Validate, Deploy]
        default: Validate
      seed_run_id:
        description: Successful Sandbox seed data run on fork dev (artifacts must be available)
        type: string
        required: true
      sample_run_id:
        description: Successful Sample workload CD run on fork dev with live validation
        type: string
        required: true
      confirmation:
        description: Enter ftk-dto-hack-s-ae46 for Deploy
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: sandbox-sample-deployment
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'bobjac/finops-toolkit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test workbook contracts and KQL conventions
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.7 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $tests = @(
            './src/powershell/Tests/Unit/DesignTimeOptimizerWorkbook.Tests.ps1'
            './src/powershell/Tests/Unit/HubsKqlOperators.Tests.ps1'
            './src/powershell/Tests/Lint/KqlJoinKinds.Tests.ps1'
          )
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = $tests
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.Filter.FullName = @(
            'Workbook deployment and price evidence contracts*'
            'HubsKqlOperators*'
            'KqlJoinKinds.Should not add bare joins*'
          )
          $result = Invoke-Pester -Configuration $configuration
          if ($result.Result -ne 'Passed') { throw 'Workbook tests failed.' }
          foreach ($script in 'Publish', 'Test') {
            $issues = @(Invoke-ScriptAnalyzer -Path "./src/scripts/$script-DesignTimeOptimizerWorkbook.ps1" -Severity Warning,Error)
            if ($issues.Count) { $issues | Format-Table -AutoSize; throw 'Workbook script lint failed.' }
          }
      - name: Compile the standalone workbook
        run: az bicep build --file src/workbooks/optimization/AiAgentTokenomicsLivePrices/deploy.bicep --stdout > "$RUNNER_TEMP/workbook-template.json"

  workbook:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && github.repository == 'bobjac/finops-toolkit' && github.ref == 'refs/heads/dev'
    environment: sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      SEED_RUN: ${{ inputs.seed_run_id }}
      SAMPLE_RUN: ${{ inputs.sample_run_id }}
      WORKBOOK_OPERATION: ${{ inputs.operation }}
      WORKBOOK_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the current revision and actual sandbox approval
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: node hack/sample-multi-agent-workload/eng/check-deployment.mjs --lifecycle --require-approval
      - name: Resolve only successful trusted predecessor artifacts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SEED_RUN" =~ ^[0-9]+$ && "$SAMPLE_RUN" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/workbook-evidence"
          gh api "repos/bobjac/finops-toolkit/actions/runs/$SEED_RUN" > "$RUNNER_TEMP/workbook-evidence/seed-run.json"
          gh api "repos/bobjac/finops-toolkit/actions/runs/$SAMPLE_RUN" > "$RUNNER_TEMP/workbook-evidence/sample-run.json"
          jq -e '.conclusion == "success" and .head_branch == "dev" and .head_repository.full_name == "bobjac/finops-toolkit" and .path == ".github/workflows/sandbox-seed.yml"' "$RUNNER_TEMP/workbook-evidence/seed-run.json"
          jq -e '.conclusion == "success" and .head_branch == "dev" and .head_repository.full_name == "bobjac/finops-toolkit" and .path == ".github/workflows/sample-workload-cd.yml"' "$RUNNER_TEMP/workbook-evidence/sample-run.json"
          attempt=$(jq -r '.run_attempt' "$RUNNER_TEMP/workbook-evidence/sample-run.json")
          gh run download "$SEED_RUN" --repo bobjac/finops-toolkit --name "sandbox-seed-$SEED_RUN" --dir "$RUNNER_TEMP/workbook-seed"
          gh run download "$SAMPLE_RUN" --repo bobjac/finops-toolkit --name "sample-validation-$SAMPLE_RUN-$attempt" --dir "$RUNNER_TEMP/workbook-sample"
          jq -e --arg run "$SEED_RUN" --arg revision "$(jq -r .head_sha "$RUNNER_TEMP/workbook-evidence/seed-run.json")" '.RunId == $run and .SourceRevision == $revision' "$RUNNER_TEMP/workbook-seed/seed-evidence-second/seed-report.json"
          jq -e --arg run "$SAMPLE_RUN" --arg revision "$(jq -r .head_sha "$RUNNER_TEMP/workbook-evidence/sample-run.json")" --arg attempt "$attempt" '.runId == $run and .revision == $revision and .runAttempt == $attempt' "$RUNNER_TEMP/workbook-sample/deployment-validation.json"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy or verify the workbook without generating model traffic
        shell: pwsh
        run: |
          az extension add --name application-insights --only-show-errors
          if ($LASTEXITCODE -ne 0) { throw 'Application Insights CLI extension installation failed.' }
          ./src/scripts/Publish-DesignTimeOptimizerWorkbook.ps1 `
            -SeedDirectory "$env:RUNNER_TEMP/workbook-seed" `
            -SampleDirectory "$env:RUNNER_TEMP/workbook-sample" `
            -Operation $env:WORKBOOK_OPERATION -ConfirmResourceGroup $env:WORKBOOK_CONFIRMATION `
            -OutputDirectory "$env:RUNNER_TEMP/workbook-evidence" -Confirm:$false
      - name: Publish readiness and limitations
        if: always()
        shell: pwsh
        run: |
          $path = "$env:RUNNER_TEMP/workbook-evidence/workbook-report.json"
          if (-not (Test-Path $path)) {
            'Workbook readiness: false. Review the failing step; no successful report exists.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $report = Get-Content $path -Raw | ConvertFrom-Json
          @(
            '### Live-price workbook'
            "Revision: $env:GITHUB_SHA"
            "Status: $($report.Status); query readiness: $($report.ReadyForWorkbook)"
            "Workbook: $($report.DeploymentOutputs.workbookUrl.value)"
            "Sample revision: $($report.SampleRevision); seed revision: $($report.SeedRevision)"
            'Public retail estimates exclude infrastructure and telemetry costs. Missing prices never mean free usage.'
            'Baseline/candidate observations do not establish evaluated answer quality, equivalent conditions, or savings.'
            'Resources are retained; expiration tags and budget declarations do not remove resources or cap charges.'
            'Open the workbook and confirm all panels visually before closing issue #8.'
          ) >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sandbox-workbook-${{ github.run_id }}
          path: ${{ runner.temp }}/workbook-evidence/*.json
          if-no-files-found: warn
          retention-days: 7
